<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Predge · "Don't Blink" ad v2 (kinetic)</title>
<style>
  /* ───────────────────────────────────────────────────────────────
     Predge kinetic-typography ad v2, Apple "Don't Blink" style.
     Cuts are beat-locked to BPM. Two ways to play it:
       · live:  SPACE (count-in) or R (instant) in a browser;
       · film:  record-ad.mjs calls window.__seek(t) frame by frame,
                so every frame is deterministic at exactly 30 fps.
     Aspect: ?ar=169 (default, 1920x1080) · ?ar=sq (1080x1080) · ?ar=vt (1080x1920).
     Everything on screen is our own pixels; no AI footage, no screen capture.
     On-screen copy rule: no em dashes (use a comma, colon or middle dot).
     ─────────────────────────────────────────────────────────────── */
  :root{
    --amber:#f5a623; --ink:#000; --fg:#fff; --dim:#8a90a0;
    --good:#35c07f; --bad:#ef5f5f; --arc:#4b9fff;
    --mono: ui-monospace,"SF Mono","Menlo","Cascadia Code",monospace;
    --sans: -apple-system,"Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--ink);overflow:hidden;}
  body{font-family:var(--sans);color:var(--fg);}

  /* 16:9 stage, letterboxed and centered so a fullscreen capture is clean */
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#000;}
  #frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
    background:#000;overflow:hidden;}

  .layer{position:absolute;inset:0;display:grid;place-items:center;
    opacity:0;visibility:hidden;}
  .layer.on{opacity:1;visibility:visible;}

  /* ── TYPE cards ─────────────────────────────────────────────── */
  .type{padding:0 8%;text-align:center;align-content:center;}
  .type .amber{color:var(--amber);}
  body:not(.sq):not(.vt) .layer.screen .screen > *{zoom:1.42;}
  .type .t{
    font-weight:800;letter-spacing:-.03em;line-height:.98;text-wrap:balance;
    font-size:clamp(2.2rem,8.2vw,8rem);}
  .type .t.sm{font-size:clamp(1.8rem,5.4vw,5rem);line-height:1.04;}
  .type .t.xs{font-size:clamp(1.5rem,4.2vw,3.9rem);line-height:1.08;}
  .type .t.amber{color:var(--amber);}
  .type .t em{font-style:normal;color:var(--amber);}
  .type .t.dim{color:var(--dim);}
  .type .k{font-family:var(--mono);font-weight:600;letter-spacing:.02em;
    font-size:clamp(1.6rem,6vw,5.6rem);color:var(--fg);font-variant-numeric:tabular-nums;}
  .type .k.big{font-size:clamp(2.4rem,11vw,10rem);font-weight:700;letter-spacing:-.02em;}
  .type .k.amber{color:var(--amber);}
  .type .kk{font-family:var(--mono);font-size:clamp(1.1rem,2.6vw,2.3rem);color:var(--dim);
    letter-spacing:.1em;text-transform:uppercase;margin-top:1.2rem;text-wrap:balance;line-height:1.35;}
  .type .kk.w{color:#e9ecf1;}
  .type .kk + .kk{margin-top:.5rem;}
  .type .src{font-family:var(--mono);font-size:clamp(.9rem,1.9vw,1.6rem);color:#7a8090;
    letter-spacing:.08em;margin-top:2rem;}

  /* multichain band (close) */
  .chains{text-align:center;padding:0 6%;}
  .chains .clab{font-family:var(--mono);color:var(--dim);letter-spacing:.14em;text-transform:uppercase;
    font-size:clamp(.95rem,2vw,1.6rem);margin-bottom:2.2rem;}
  .chains .csub{font-family:var(--mono);color:#e9ecf1;letter-spacing:.02em;
    font-size:clamp(1.2rem,2.8vw,2.4rem);margin-top:2.2rem;text-wrap:balance;line-height:1.4;}
  .chains .csub .d{color:var(--amber);}
  .chains .csub .ci{white-space:nowrap;}
  body.sq .chains .csub .d, body.vt .chains .csub .d{display:none;}
  body.sq .chains .csub, body.vt .chains .csub{display:flex;flex-wrap:wrap;justify-content:center;gap:.3em 1.1em;}
  .chains .clogos{display:flex;gap:clamp(1.4rem,4vw,3.4rem);justify-content:center;align-items:center;flex-wrap:wrap;}
  .chains .clogo{display:inline-flex;align-items:center;gap:.7rem;font-family:var(--mono);
    font-weight:700;font-size:clamp(1.8rem,5vw,4rem);color:var(--fg);}
  .chains .cico{width:clamp(2rem,5vw,3.6rem);height:clamp(2rem,5vw,3.6rem);flex:none;}

  /* platform logo + label (Polymarket / Kalshi / sports) */
  .type .plat{display:inline-flex;align-items:center;gap:1.2rem;justify-content:center;flex-wrap:wrap;}
  .type .plat .pico{width:clamp(2.6rem,7vw,5.4rem);height:clamp(2.6rem,7vw,5.4rem);flex:none;}
  .type .plat .k{font-size:clamp(2rem,7.4vw,7rem);font-weight:700;}
  .type .sprow{display:flex;gap:clamp(1rem,3vw,2.6rem);justify-content:center;margin-top:1.6rem;}
  .type .sprow .spi{width:clamp(3rem,7vw,7rem);height:clamp(3rem,7vw,7rem);}

  /* Telegram alert mockup */
  .tg{width:min(60%,780px);border-radius:16px;border:1px solid #23262e;background:#0e1621;
    box-shadow:0 40px 120px rgba(0,0,0,.7);overflow:hidden;}
  .tg .tgbar{display:flex;align-items:center;gap:.9rem;padding:1rem 1.3rem;background:#17212b;border-bottom:1px solid #23262e;}
  .tg .tgav{width:44px;height:44px;border-radius:50%;background:var(--amber);color:#000;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:1.4rem;flex:none;}
  .tg .tgnm{font-family:var(--sans);font-weight:700;color:#fff;font-size:1.15rem;}
  .tg .tgst{font-family:var(--mono);font-size:.8rem;color:#5a9;}
  .tg .tgbody{padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;}
  @keyframes tgslide{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
  .layer.on .tgin{animation:tgslide .26s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .tgin2{animation:tgslide .26s cubic-bezier(.2,.8,.2,1) both;animation-delay:.55s;}
  .tg .tgmsg{background:#182533;border-radius:12px 12px 12px 4px;padding:1rem 1.2rem;max-width:86%;}
  .tg .tgmsg.watch{border-left:3px solid var(--amber);}
  .tg .tgtitle .eye{color:var(--amber);}
  .tg .tgtitle{font-family:var(--sans);font-weight:800;color:#fff;font-size:1.3rem;margin-bottom:.4rem;}
  .tg .tgline{font-family:var(--mono);color:#e9ecf1;font-size:1.05rem;}
  .tg .tgline .a{color:var(--amber);} .tg .tgline .s.y{color:var(--good);font-weight:700;} .tg .tgline .s.n{color:var(--bad);font-weight:700;}
  .tg .tgmk{font-family:var(--mono);color:#8a90a0;font-size:.92rem;margin-top:.5rem;}
  .tg .tgfoot{display:flex;align-items:center;gap:.6rem;margin-top:.7rem;font-family:var(--mono);font-size:.82rem;color:#5a9;}
  .tg .tgfoot .ok{color:var(--good);} .tg .tgfoot .tgt{margin-left:auto;color:#5a6b7a;}

  /* APP dashboard mockup */
  .appd{width:min(84%,1260px);}
  .appd .appstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#191c22;padding:1px;}
  .appd .ast{background:#0b0d10;padding:1rem 1.2rem;}
  .appd .ast .al{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .appd .ast .av{font-family:var(--mono);font-size:clamp(1.2rem,2.3vw,2rem);font-weight:700;color:#e9ecf1;margin-top:.3rem;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .appd .appin{padding:1rem 1.3rem;}
  .appd .aih{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:.6rem;display:flex;}
  .appd .aih span:last-child{margin-left:auto;color:var(--dim);}
  .appd .airow{display:grid;grid-template-columns:1fr 5rem 6rem;gap:1.3rem;align-items:center;padding:.6rem 0;border-top:1px solid #191c22;font-family:var(--mono);font-size:1rem;}
  .appd .airow .mk{color:#e9ecf1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .appd .airow .n{color:var(--dim);text-align:right;} .appd .airow .pc{color:var(--amber);font-weight:700;text-align:right;}
  .layer.on .appd .airow{animation:rowIn .34s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .appd .airow:nth-of-type(3){animation-delay:.08s;}
  .layer.on .appd .airow:nth-of-type(4){animation-delay:.16s;}

  /* subtle entrances, kept fast so cuts read as "blinks", not fades */
  @keyframes pop{from{transform:scale(.965);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes rise{from{transform:translateY(.5em);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .layer.on .anim-pop{animation:pop .14s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .anim-rise{animation:rise .18s cubic-bezier(.2,.8,.2,1) both;}

  /* ── BEAT-LOCKED TRANSITIONS ─────────────────────────────────── */
  @keyframes punch{0%{transform:scale(1.09);}100%{transform:scale(1);}}
  .layer.type.on .t,.layer.type.on .k,.layer.type.on .chains{animation:punch .12s cubic-bezier(.15,.9,.2,1) both;}
  @keyframes glitch{
    0%{text-shadow:3px 0 var(--bad),-3px 0 var(--arc);transform:translateX(0);}
    25%{text-shadow:-3px 0 var(--bad),3px 0 var(--arc);transform:translateX(2px);}
    50%{text-shadow:2px 0 var(--bad),-2px 0 var(--arc);transform:translateX(-2px);}
    75%{text-shadow:-1px 0 var(--bad),1px 0 var(--arc);transform:translateX(1px);}
    100%{text-shadow:none;transform:translateX(0);}}
  .layer.type.on .amber,.layer.type.on .t.amber{animation:glitch .18s steps(2,end) 1;}
  @keyframes screenIn{0%{transform:scale(1.05);}100%{transform:scale(1);}}
  .layer.screen.on .screen{animation:screenIn .14s cubic-bezier(.2,.85,.2,1) both;}
  /* flash: a white beat on the drop (driven by the engine, not CSS) */
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6;}

  /* ── LIVE SCREEN MOTION ── */
  @keyframes liveDot{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes glowPulse{0%,100%{text-shadow:0 0 0 transparent;}50%{text-shadow:0 0 22px color-mix(in srgb,var(--amber) 55%,transparent);}}
  @keyframes rowIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes caretBlink{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes lineIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:none;}}
  @keyframes grow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .win .bar .ad::after{content:"";display:inline-block;width:8px;height:8px;margin-left:.55rem;
    border-radius:50%;background:var(--good);vertical-align:middle;}
  .layer.on .win .bar .ad::after{animation:liveDot 1.1s ease-in-out infinite;}
  .layer.on .feed .row{animation:rowIn .34s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .feed .row:nth-of-type(2){animation-delay:.1s;}
  .layer.on .feed .row:nth-of-type(3){animation-delay:.2s;}
  .layer.on .feed .row:nth-of-type(4){animation-delay:.3s;}
  .layer.on .feed .row:nth-of-type(5){animation-delay:.4s;}
  .layer.on .verdict .pill{animation:pop .3s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .verdict .v.g{animation:glowPulse 1.8s ease-in-out infinite;}
  /* terminal: lines appear one after another (each .ln gets --i), blinking caret at the end */
  .win .body .ln{display:block;white-space:pre-wrap;}
  .layer.on .win .body .ln{animation:lineIn .16s ease both;animation-delay:calc(var(--i,0) * .32s);}
  .caret{display:inline-block;width:.6ch;height:1.05em;margin-left:2px;
    background:var(--good);vertical-align:text-bottom;}
  .layer.on .caret{animation:caretBlink 1s steps(1) infinite;}

  /* ── SCREEN mockups (our real product surfaces) ─────────────── */
  .screen{width:100%;height:100%;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 0%,#14161b 0%,#000 72%);}
  .win{width:min(76%,1180px);border-radius:14px;border:1px solid #23262e;
    background:#0b0d10;box-shadow:0 40px 120px rgba(0,0,0,.7);overflow:hidden;}
  .win .bar{display:flex;align-items:center;gap:.55rem;padding:.7rem 1rem;
    background:#131519;border-bottom:1px solid #23262e;}
  .win .bar i{width:11px;height:11px;border-radius:50%;background:#3a3f49;display:block;flex:none;}
  .win .bar i.r{background:#ff5f57;}.win .bar i.y{background:#febc2e;}.win .bar i.g{background:#28c840;}
  .win .bar .ad{margin-left:.6rem;font-family:var(--mono);font-size:.9rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .win .bar .ad b{color:var(--fg);font-weight:500;}
  .win .body{padding:1.2rem 1.4rem;font-family:var(--mono);font-size:1.12rem;line-height:1.6;color:#e9ecf1;}
  .cd{color:var(--dim);}.ca{color:var(--amber);}.cg{color:var(--good);}.cb{color:var(--arc);}.cr{color:var(--bad);}.cw{color:#fff;font-weight:700;}

  /* live whale feed */
  .feed .fh{display:flex;align-items:center;gap:.8rem;padding:1rem 1.3rem .8rem;font-family:var(--mono);
    font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);}
  .feed .fh .lv{width:9px;height:9px;border-radius:50%;background:var(--good);}
  .layer.on .feed .fh .lv{animation:liveDot 1.1s ease-in-out infinite;}
  .feed .fh span:last-child{margin-left:auto;color:var(--dim);}
  .feed .row{display:grid;grid-template-columns:2.2rem 1fr 7rem 6.5rem;gap:1rem;align-items:center;
    padding:.75rem 1.3rem;border-top:1px solid #191c22;font-family:var(--mono);font-size:1.04rem;}
  .feed .row .dir.u{color:var(--good);} .feed .row .dir.d{color:var(--bad);}
  .feed .row .mk{color:#e9ecf1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .feed .row .mk small{display:block;color:var(--dim);font-size:.82rem;}
  .feed .row .a{color:var(--amber);font-variant-numeric:tabular-nums;text-align:right;font-weight:700;}
  .feed .row .ago{color:var(--dim);text-align:right;font-size:.9rem;}

  /* record / verdict cards */
  .verdict{width:min(74%,980px);border:1px solid #23262e;border-radius:16px;background:#0b0d10;
    padding:1.6rem 1.8rem;box-shadow:0 40px 120px rgba(0,0,0,.7);}
  .verdict .a{font-family:var(--mono);font-size:1rem;color:var(--dim);}
  .verdict .q{font-family:var(--sans);font-weight:800;font-size:clamp(1.3rem,2.4vw,2rem);color:#fff;margin-top:.35rem;letter-spacing:-.01em;}
  .verdict .pill{display:inline-flex;align-items:center;gap:.45rem;margin:.9rem 0;color:var(--amber);
    font-weight:800;font-size:1.25rem;background:color-mix(in srgb,var(--amber) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--amber) 40%,#23262e);border-radius:999px;padding:.4rem 1rem;}
  .verdict .pill.g{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);border-color:color-mix(in srgb,var(--good) 40%,#23262e);}
  .verdict .grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #23262e;border-radius:12px;overflow:hidden;}
  .verdict .grid.two{grid-template-columns:1fr 1fr;}
  .verdict .c{padding:.85rem 1.1rem;border-right:1px solid #191c22;}
  .verdict .c:last-child{border-right:none;}
  .verdict .c .l{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .verdict .c .v{font-family:var(--mono);font-size:1.6rem;font-weight:700;margin-top:.2rem;font-variant-numeric:tabular-nums;}
  .verdict .c .v.g{color:var(--good);} .verdict .c .v.am{color:var(--amber);} .verdict .c .v small{font-size:.8rem;color:var(--dim);font-weight:400;}
  .verdict .tl{margin-top:1rem;font-family:var(--mono);font-size:.98rem;color:#e9ecf1;line-height:1.7;}
  .verdict .tl .ln{display:block;}
  .layer.on .verdict .tl .ln{animation:lineIn .16s ease both;animation-delay:calc(.25s + var(--i,0) * .3s);}
  .verdict .sg{margin-top:1rem;font-family:var(--mono);font-size:.86rem;color:var(--dim);word-break:break-all;}
  .verdict .sg .ok{color:var(--good);}
  .verdict .chips{display:flex;flex-wrap:wrap;gap:.6rem;margin:.4rem 0 1.1rem;}
  .verdict .chip{font-family:var(--mono);font-size:1rem;color:#e9ecf1;border:1px solid #2c303a;border-radius:999px;padding:.35rem .9rem;background:#111318;}
  .verdict .chip b{color:var(--amber);font-weight:700;}
  .layer.on .verdict .chip{animation:pop .3s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .verdict .chip:nth-child(2){animation-delay:.08s;}
  .layer.on .verdict .chip:nth-child(3){animation-delay:.16s;}
  /* arbiter timeline */
  .tline{position:relative;margin:1.3rem 0 .6rem;height:68px;}
  .tline .track{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:#1d2027;}
  .tline .fill{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--amber);transform-origin:left;}
  .layer.on .tline .fill{animation:grow 2.2s linear both;animation-delay:.2s;}
  .tline .dot{position:absolute;top:13px;width:20px;height:20px;border-radius:50%;background:#0b0d10;border:3px solid var(--amber);}
  .tline .dot.e{right:0;border-color:var(--good);} .tline .dot.s{left:0;}
  .tline .lab{position:absolute;top:44px;font-family:var(--mono);font-size:.86rem;color:var(--dim);}
  .tline .lab.s{left:0;} .tline .lab.m{left:50%;transform:translateX(-50%);color:var(--amber);} .tline .lab.e{right:0;color:var(--good);}

  /* sign-in card */
  .signin{width:min(56%,760px);border:1px solid #23262e;border-radius:18px;background:#0b0d10;padding:2rem 2.2rem;
    box-shadow:0 40px 120px rgba(0,0,0,.7);text-align:center;}
  .signin .swm{width:min(320px,60%);height:auto;}
  .signin .st{font-family:var(--sans);color:var(--dim);font-size:1.05rem;margin:.6rem 0 1.4rem;}
  .signin .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;}
  .signin .o{font-family:var(--mono);font-size:1rem;color:#e9ecf1;border:1px solid #2c303a;border-radius:10px;padding:.75rem .4rem;background:#111318;}
  .signin .o.hi{border-color:color-mix(in srgb,var(--amber) 60%,#2c303a);color:var(--amber);}
  .layer.on .signin .o{animation:pop .26s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * .06s);}

  /* repos card */
  .repos{display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap;margin-top:1.8rem;}
  .repo{font-family:var(--mono);text-align:left;border:1px solid #2c303a;border-radius:14px;background:#0b0d10;padding:1rem 1.3rem;min-width:min(30rem,80vw);}
  .repo .rn{font-size:clamp(1.1rem,2.2vw,1.8rem);color:#fff;font-weight:700;}
  .repo .rn span{color:var(--dim);font-weight:400;}
  .repo .rd{font-size:clamp(.8rem,1.3vw,1.05rem);color:var(--dim);margin-top:.4rem;}

  /* logo close */
  .logo{display:flex;flex-direction:column;align-items:center;gap:1.5rem;text-align:center;}
  .logo .tag{color:#fff;font-weight:800;font-size:clamp(1.4rem,3.4vw,3rem);letter-spacing:-.02em;}
  .logo .tag em{font-style:normal;color:var(--amber);}
  .logo .url{font-family:var(--mono);color:var(--dim);font-size:clamp(.95rem,1.9vw,1.5rem);letter-spacing:.08em;}
  .logo .url b{color:#e9ecf1;font-weight:500;}

  /* ── ASPECT VARIANTS (square for X/LinkedIn, vertical 9:16) ── */
  body.sq #frame, body.vt #frame{width:100vw;height:100vh;}
  body.sq{font-size:17px;} body.vt{font-size:19px;}
  body.sq .type, body.vt .type{padding:0 6%;}
  body.sq .type .t{font-size:9vw;} body.sq .type .t.sm{font-size:6.8vw;} body.sq .type .t.xs{font-size:5.4vw;}
  body.vt .type .t{font-size:11vw;} body.vt .type .t.sm{font-size:7.6vw;} body.vt .type .t.xs{font-size:6.6vw;}
  body.sq .type .k, body.vt .type .k{font-size:7.4vw;}
  body.sq .type .k.big, body.vt .type .k.big{font-size:15vw;}
  body.sq .type .kk, body.vt .type .kk{font-size:3.1vw;}
  body.sq .type .plat .k, body.vt .type .plat .k{font-size:9vw;}
  body.sq .win, body.vt .win, body.sq .verdict, body.vt .verdict, body.sq .appd, body.vt .appd{width:94%;}
  body.sq .tg, body.vt .tg, body.sq .signin, body.vt .signin{width:88%;}
  body.sq .verdict .grid, body.vt .verdict .grid{grid-template-columns:1fr 1fr;}

  function logoClose(){return `<div class="logo">
    <img class="anim-pop" src="ad-assets/predge-wordmark.svg" alt="PREDGE." style="width:min(760px,64vw);height:auto;">
    <div class="tag anim-rise">Verify, <em>don't trust.</em></div>
    <div class="url anim-rise"><b>predge.io</b> · <b>app.predge.io</b><span class="sep"></span><span class="vtx"> · </span><b>@PredgeAI</b></div>
  </div>`;}

  // ── ENGINE ────────────────────────────────────────────────────
  const frame = document.getElementById('frame');
  const flash = document.getElementById('flash');
  document.getElementById('bpmv').textContent = BPM;
  const layers = FRAMES.map(f=>{
    const el=document.createElement('div');
    el.className='layer '+f.cls;
    el.innerHTML=f.html;
    frame.appendChild(el);
    return el;
  });
  if (AR==='vt') document.querySelectorAll('.vtx').forEach(n=>n.remove());
  const starts=[]; let acc=0;
  FRAMES.forEach(f=>{starts.push(acc); acc+=f.b*BEAT;});
  const TOTAL=acc;
  window.__ad = { BPM, BEAT, TOTAL, starts, beats: FRAMES.map(f=>f.b), n: FRAMES.length };

  let raf=null, t0=0, cur=-1, running=false;
  const clock=document.getElementById('clock');

  // Count-ups: value is a pure function of time-in-frame (so seeking is deterministic).
  function setCounts(el, dt){
    el.querySelectorAll('[data-count]').forEach(node=>{
      const target=parseFloat(node.getAttribute('data-count'));
      const dec=parseInt(node.getAttribute('data-dec')||'0',10);
      const prefix=node.getAttribute('data-prefix')||'', suffix=node.getAttribute('data-suffix')||'';
      const start=target*0.955, p=Math.min(1,Math.max(0,dt/0.6)), eased=1-Math.pow(1-p,3);
      const v=start+(target-start)*eased;
      node.textContent=prefix+v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suffix;
    });
  }
  function frameAt(t){
    let i=starts.length-1;
    for(let k=0;k<starts.length;k++){ if(t<starts[k]){ i=k-1; break; } }
    return Math.max(0,Math.min(i,layers.length-1));
  }
  function showFrame(i){
    if(i===cur) return;
    if(cur>=0) layers[cur].classList.remove('on');
    cur=i;
    const el=layers[i];
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  }
  function flashAt(i, dt){
    if(!FRAMES[i].flash || dt>0.18){ flash.style.opacity=0; return; }
    flash.style.opacity = dt<0.018 ? (0.55*dt/0.018) : (0.55*(1-(dt-0.018)/0.162));
  }
  // Deterministic seek used by the recorder: pause every CSS animation and set it to the frame-local time.
  window.__seek = (t)=>{
    const i=frameAt(t); showFrame(i);
    const dt=t-starts[i];
    for(const a of document.getAnimations()){ a.pause(); a.currentTime=dt*1000; }
    setCounts(layers[i], dt); flashAt(i, dt);
    return i;
  };

  function tick(now){
    const t=(now-t0)/1000;
    const i=frameAt(t); showFrame(i);
    setCounts(layers[i], t-starts[i]); flashAt(i, t-starts[i]);
    clock.textContent=t.toFixed(1)+'s · frame '+(cur+1)+'/'+layers.length;
    if(t<TOTAL){ raf=requestAnimationFrame(tick); } else { running=false; }
  }
  function play(){
    cancelAnimationFrame(raf); cur=-1; layers.forEach(l=>l.classList.remove('on'));
    running=true; t0=performance.now(); raf=requestAnimationFrame(tick);
  }
  const count=document.getElementById('count'), countn=document.getElementById('countn');
  function startWithCountIn(){
    if(running) return;
    let n=3; count.classList.add('on'); countn.classList.remove('go'); countn.textContent=n;
    const iv=setInterval(()=>{
      n--;
      if(n>0){ countn.textContent=n; }
      else if(n===0){ countn.textContent='●'; countn.classList.add('go'); }
      else{ clearInterval(iv); count.classList.remove('on'); play(); }
    }, BEAT*1000);
  }
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(e.key===' '){ e.preventDefault(); startWithCountIn(); }
    else if(k==='r'){ e.preventDefault(); play(); }
    else if(k==='f'){ e.preventDefault(); (document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()); }
    else if(k==='h'){ e.preventDefault(); document.body.classList.toggle('recording'); }
  });
  showFrame(0); setCounts(layers[0], 1);
</script>
</body>
