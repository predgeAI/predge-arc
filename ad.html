<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Predge — 'Don't Blink' ad (kinetic)</title>
<style>
  /* ───────────────────────────────────────────────────────────────
     Predge kinetic-typography ad, Apple "Don't Blink" style.
     Record this fullscreen (OBS / QuickTime, 1920×1080, 60fps).
     Cuts are beat-locked — set BPM in the <script> to match your track,
     then hit SPACE exactly on the drop so text and music lock together.
     Everything on screen is our own product; no third-party assets.
     ─────────────────────────────────────────────────────────────── */
  :root{
    --amber:#f5a623; --ink:#000; --fg:#fff; --dim:#8a90a0;
    --good:#35c07f; --bad:#ef5f5f; --arc:#4b9fff;
    --mono: ui-monospace,"SF Mono","Menlo","Cascadia Code",monospace;
    --sans: -apple-system,"Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--ink);overflow:hidden;}
  body{font-family:var(--sans);color:var(--fg);}

  /* 16:9 stage, letterboxed and centered so a fullscreen capture is clean */
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#000;}
  #frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
    background:#000;overflow:hidden;}

  .layer{position:absolute;inset:0;display:grid;place-items:center;
    opacity:0;visibility:hidden;}
  .layer.on{opacity:1;visibility:visible;}

  /* ── TYPE cards ─────────────────────────────────────────────── */
  .type{padding:0 8%;text-align:center;}
  .type .t{
    font-weight:800;letter-spacing:-.03em;line-height:.98;text-wrap:balance;
    font-size:clamp(2.2rem,8.2vw,8rem);}
  .type .t.sm{font-size:clamp(1.8rem,5.4vw,5rem);}
  .type .t.amber{color:var(--amber);}
  .type .t em{font-style:normal;color:var(--amber);}
  .type .t .strike{color:var(--dim);text-decoration:line-through;text-decoration-thickness:.06em;}
  .type .k{font-family:var(--mono);font-weight:600;letter-spacing:.02em;
    font-size:clamp(1.6rem,6vw,5.6rem);color:var(--fg);}
  .type .kk{font-family:var(--mono);font-size:clamp(1rem,2.4vw,2rem);color:var(--dim);
    letter-spacing:.12em;text-transform:uppercase;margin-top:1.2rem;}

  /* multichain band (close) */
  .chains{text-align:center;padding:0 6%;}
  .chains .crow{font-family:var(--mono);font-weight:700;letter-spacing:-.01em;
    font-size:clamp(2.2rem,7vw,6rem);line-height:1;}
  .chains .crow .camber{color:var(--amber);}
  .chains .csub{font-family:var(--mono);color:var(--dim);letter-spacing:.06em;
    font-size:clamp(.95rem,2.2vw,1.8rem);margin-top:1.4rem;}
  .chains .clogos{display:flex;gap:clamp(1.4rem,4vw,3.4rem);justify-content:center;align-items:center;flex-wrap:wrap;}
  .chains .clogo{display:inline-flex;align-items:center;gap:.7rem;font-family:var(--mono);
    font-weight:700;font-size:clamp(1.8rem,5vw,4rem);color:var(--fg);}
  .chains .cico{width:clamp(2rem,5vw,3.6rem);height:clamp(2rem,5vw,3.6rem);flex:none;}

  /* real product screenshot flashed in the ad */
  .realui{width:min(88%,1400px);border-radius:14px;border:1px solid #23262e;
    box-shadow:0 40px 120px rgba(0,0,0,.7);}

  /* platform logo + label (Polymarket / Kalshi) */
  .type .plat{display:inline-flex;align-items:center;gap:1rem;justify-content:center;flex-wrap:wrap;}
  .type .plat .pico{width:clamp(2.2rem,5.5vw,4rem);height:clamp(2.2rem,5.5vw,4rem);flex:none;}

  /* subtle entrances — kept fast so cuts read as "blinks", not fades */
  @keyframes pop{from{transform:scale(.965);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes rise{from{transform:translateY(.5em);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .layer.on .anim-pop{animation:pop .14s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .anim-rise{animation:rise .18s cubic-bezier(.2,.8,.2,1) both;}
  @media (prefers-reduced-motion:reduce){.anim-pop,.anim-rise{animation:none!important;}}

  /* ── BEAT-LOCKED TRANSITIONS ─────────────────────────────────── */
  /* zoom-punch: type frames slam in with a hard scale + micro-blur */
  @keyframes punch{0%{transform:scale(1.14);opacity:0;filter:blur(7px);}
    55%{opacity:1;filter:blur(0);}100%{transform:scale(1);}}
  .layer.type.on .t,.layer.type.on .k,.layer.type.on .chains{animation:punch .2s cubic-bezier(.15,.9,.2,1) both;}
  /* glitch: RGB-split jitter on amber accent words as they hit */
  @keyframes glitch{
    0%{text-shadow:3px 0 var(--bad),-3px 0 var(--arc);transform:translateX(0);}
    25%{text-shadow:-3px 0 var(--bad),3px 0 var(--arc);transform:translateX(2px);}
    50%{text-shadow:2px 0 var(--bad),-2px 0 var(--arc);transform:translateX(-2px);}
    75%{text-shadow:-1px 0 var(--bad),1px 0 var(--arc);transform:translateX(1px);}
    100%{text-shadow:none;transform:translateX(0);}}
  .layer.type.on .amber,.layer.type.on .t.amber{animation:glitch .18s steps(2,end) 1;}
  /* screens rush in with a directional motion-blur wipe */
  @keyframes screenIn{0%{opacity:0;filter:blur(16px);transform:scale(1.05) translateX(3%);}
    100%{opacity:1;filter:blur(0);transform:scale(1) translateX(0);}}
  .layer.screen.on .screen{animation:screenIn .3s cubic-bezier(.2,.85,.2,1) both;}
  /* flash: a white beat on every screen cut */
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6;}
  @keyframes flashfx{0%{opacity:0;}10%{opacity:.55;}100%{opacity:0;}}
  #flash.hit{animation:flashfx .16s ease-out;}
  @media (prefers-reduced-motion:reduce){
    .layer.type.on .t,.layer.type.on .k,.layer.type.on .chains,
    .layer.type.on .amber,.layer.screen.on .screen,#flash.hit{animation:none!important;}
  }

  /* ── LIVE SCREEN MOTION — makes the product surfaces feel alive ── */
  @keyframes liveDot{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes glowPulse{0%,100%{text-shadow:0 0 0 transparent;}50%{text-shadow:0 0 22px color-mix(in srgb,var(--amber) 55%,transparent);}}
  @keyframes rowIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes caretBlink{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes lineIn{from{opacity:0;}to{opacity:1;}}
  /* live dot in the window/app title bar */
  .win .bar .ad::after{content:"";display:inline-block;width:8px;height:8px;margin-left:.55rem;
    border-radius:50%;background:var(--good);vertical-align:middle;}
  .layer.on .win .bar .ad::after{animation:liveDot 1.1s ease-in-out infinite;}
  /* feed: big number glows, rows slide in staggered */
  .layer.on .feed .big{animation:glowPulse 1.8s ease-in-out infinite;}
  .layer.on .feed .row{animation:rowIn .34s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .feed .row:nth-of-type(1){animation-delay:.02s;}
  .layer.on .feed .row:nth-of-type(2){animation-delay:.14s;}
  .layer.on .feed .row:nth-of-type(3){animation-delay:.26s;}
  /* checker verdict: pill pops, value cells glow */
  .layer.on .verdict .pill{animation:pop .3s cubic-bezier(.2,.8,.2,1) both;}
  .layer.on .verdict .v.g{animation:glowPulse 1.8s ease-in-out infinite;}
  /* terminal / arcscan: body lines fade in top-to-bottom, blinking caret at the end */
  .layer.on .win .body pre{animation:lineIn .4s ease both;}
  .caret{display:inline-block;width:.6ch;height:1.05em;margin-left:2px;
    background:var(--good);vertical-align:text-bottom;}
  .layer.on .caret{animation:caretBlink 1s steps(1) infinite;}
  @media (prefers-reduced-motion:reduce){
    .win .bar .ad::after,.feed .big,.feed .row,.verdict .pill,.verdict .v,.win .body pre,.caret{animation:none!important;}
  }

  /* ── SCREEN mockups (our real product surfaces) ─────────────── */
  .screen{width:100%;height:100%;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 0%,#14161b 0%,#000 72%);}
  .win{width:min(76%,1180px);border-radius:14px;border:1px solid #23262e;
    background:#0b0d10;box-shadow:0 40px 120px rgba(0,0,0,.7);overflow:hidden;}
  .win .bar{display:flex;align-items:center;gap:.55rem;padding:.7rem 1rem;
    background:#131519;border-bottom:1px solid #23262e;}
  .win .bar i{width:11px;height:11px;border-radius:50%;background:#3a3f49;display:block;}
  .win .bar i.r{background:#ff5f57;}.win .bar i.y{background:#febc2e;}.win .bar i.g{background:#28c840;}
  .win .bar .ad{margin-left:.6rem;font-family:var(--mono);font-size:.9rem;color:var(--dim);}
  .win .bar .ad b{color:var(--fg);font-weight:500;}
  .win .body{padding:1.1rem 1.35rem;font-family:var(--mono);font-size:1rem;line-height:1.55;color:#e9ecf1;}
  .win .body pre{margin:0;white-space:pre-wrap;}
  .cd{color:var(--dim);}.ca{color:var(--amber);}.cg{color:var(--good);}.cb{color:var(--arc);}.cr{color:var(--bad);}

  /* dashboard feed */
  .feed .big{font-family:var(--mono);font-size:clamp(1.8rem,4vw,3rem);font-weight:800;
    padding:1rem 1.3rem .2rem;font-variant-numeric:tabular-nums;}
  .feed .lbl{font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);padding:0 1.3rem 1rem;}
  .feed .row{display:grid;grid-template-columns:1fr auto auto;gap:1.2rem;align-items:center;
    padding:.7rem 1.3rem;border-top:1px solid #191c22;font-family:var(--mono);font-size:1.02rem;}
  .feed .row .mk{color:#e9ecf1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .feed .row .s{font-weight:700;font-size:.9rem;}.feed .row .s.y{color:var(--good);}.feed .row .s.n{color:var(--bad);}
  .feed .row .a{color:var(--amber);font-variant-numeric:tabular-nums;}

  /* checker verdict */
  .verdict{width:min(72%,880px);border:1px solid #23262e;border-radius:16px;background:#0b0d10;
    padding:1.6rem 1.8rem;box-shadow:0 40px 120px rgba(0,0,0,.7);}
  .verdict .a{font-family:var(--mono);font-size:1rem;color:var(--dim);}
  .verdict .pill{display:inline-flex;align-items:center;gap:.45rem;margin:.9rem 0;color:var(--good);
    font-weight:800;font-size:1.5rem;background:color-mix(in srgb,var(--good) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--good) 40%,#23262e);border-radius:999px;padding:.45rem 1.1rem;}
  .verdict .grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #23262e;border-radius:12px;overflow:hidden;}
  .verdict .c{padding:.85rem 1.1rem;border-right:1px solid #191c22;border-bottom:1px solid #191c22;}
  .verdict .c:nth-child(2n){border-right:none;}
  .verdict .c .l{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .verdict .c .v{font-family:var(--mono);font-size:1.7rem;font-weight:700;margin-top:.2rem;font-variant-numeric:tabular-nums;}
  .verdict .c .v.g{color:var(--good);}.verdict .c .v small{font-size:.8rem;color:var(--dim);font-weight:400;}
  .verdict .sg{margin-top:1rem;font-family:var(--mono);font-size:.86rem;color:var(--dim);}
  .verdict .sg .ok{color:var(--good);}

  /* logo close */
  .logo{display:flex;flex-direction:column;align-items:center;gap:1.4rem;text-align:center;}
  .logo .mk{width:clamp(70px,9vw,120px);aspect-ratio:1;border-radius:22%;background:var(--amber);
    color:#000;display:grid;place-items:center;font-weight:900;font-family:var(--mono);
    font-size:clamp(3rem,6vw,5.5rem);}
  .logo .wm{font-family:var(--mono);font-weight:700;letter-spacing:.06em;font-size:clamp(1.6rem,4vw,3rem);}
  .logo .tag{color:var(--amber);font-weight:700;font-size:clamp(1.1rem,2.6vw,2rem);letter-spacing:-.01em;}
  .logo .url{font-family:var(--mono);color:var(--dim);font-size:clamp(.9rem,1.8vw,1.3rem);letter-spacing:.14em;}

  /* ── countdown + operator HUD (never recorded — start, then go fullscreen) ── */
  #hud{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1.2rem;background:#0a0b0e;
    border-top:1px solid #23262e;font-family:var(--mono);font-size:.8rem;color:var(--dim);
    display:flex;gap:1.4rem;align-items:center;z-index:20;}
  #hud b{color:var(--amber);}
  #hud .sp{margin-left:auto;}
  #count{position:fixed;inset:0;display:none;place-items:center;background:#000;z-index:15;}
  #count.on{display:grid;}
  #count .n{font-family:var(--mono);font-weight:800;font-size:22vh;color:var(--fg);}
  #count .n.go{color:var(--amber);}
  body.recording #hud{display:none;}
</style>
</head>
<body>

<div id="stage"><div id="frame">
  <!-- layers are injected by JS from the FRAMES list -->
  <div id="flash"></div>
</div></div>

<div id="count"><div class="n" id="countn">3</div></div>

<div id="hud">
  <span>Predge · "Don't Blink" ad</span>
  <span>BPM <b id="bpmv">128</b></span>
  <span><b>SPACE</b> start on the drop</span>
  <span><b>R</b> restart</span>
  <span><b>F</b> fullscreen</span>
  <span><b>H</b> hide this bar</span>
  <span class="sp" id="clock">00.0s · frame 0</span>
</div>

<script>
  // ── TIMING ────────────────────────────────────────────────────
  // Cuts are measured in BEATS, so the whole ad retimes to any track:
  // just set BPM to your chosen royalty-free song's tempo.
  const BPM = 125;                     // ← Tiger Rhythm (Surkin) tempo
  const BEAT = 60 / BPM;               // seconds per beat
  const COUNT_IN_BEATS = 4;            // 3·2·1·GO before frame 1

  // Each frame: { b: duration in beats, html: stage content, cls: layer class }
  // Total ≈ sum(b) beats. At 128 BPM the script below runs ~54s.
  const T = (cls, html) => ({ cls, html });
  const FRAMES = [
    // ACT 1 — the hook: the trust problem, before any single vertical
    { b:3, ...T('type', `<div class="t anim-rise">Anyone can post</div>`) },
    { b:3, ...T('type', `<div class="t anim-rise">a <span class="strike">winning</span> screenshot.</div>`) },
    { b:2, ...T('type', `<div class="t sm anim-pop" style="color:var(--dim)">…after the outcome.</div>`) },
    { b:3, ...T('type', `<div class="t anim-pop">Predge signs every call</div>`) },
    { b:4, ...T('type', `<div class="t amber anim-pop">before it.</div>`) },
    { b:2, ...T('type', `<div class="t sm anim-pop">Not after.</div>`) },
    { b:2, ...T('type', `<div class="k anim-pop">ed25519</div><div class="kk">signed while the market is still open</div>`) },
    { b:3, ...T('type', `<div class="t sm amber anim-pop">Tamper-evident<br>by construction.</div>`) },

    // ACT 2 — breadth: not one market. verifiable intelligence across all of them.
    { b:3, ...T('type', `<div class="t sm anim-rise">Not just prediction markets.</div>`) },
    { b:4, ...T('screen', realScreen()) },
    { b:2, ...T('type', `<div class="plat anim-pop">${pmLogo()}<span class="k">Polymarket whales.</span></div>`) },
    { b:3, ...T('screen', feedScreen()) },
    { b:4, ...T('screen', kalshiScreen()) },
    { b:2, ...T('type', `<div class="plat anim-pop">${kalshiLogo()}<span class="k">Kalshi institutional flow.</span></div>`) },
    { b:4, ...T('screen', sportsScreen()) },
    { b:2, ...T('type', `<div class="k anim-pop">Sports outcomes.</div>`) },
    { b:2, ...T('type', `<div class="k anim-pop">On-chain activity.</div>`) },
    { b:3, ...T('type', `<div class="t sm amber anim-pop">Every signal — signed.</div>`) },

    // ACT 3 — the scale
    { b:2, ...T('type', `<div class="k anim-pop">1,000,000+</div><div class="kk">smart-money wallets scored</div>`) },
    { b:3, ...T('type', `<div class="k anim-pop" data-count="15753076">15,700,000</div><div class="kk">signals — every one verifiable</div>`) },

    // ACT 4 — three audiences (agents first — the machine buyer leads)
    { b:3, ...T('type', `<div class="t sm anim-rise">Agents get an <span class="amber">API.</span></div>`) },
    { b:4, ...T('screen', termScreen()) },
    { b:3, ...T('type', `<div class="t sm anim-pop">Pay per call. USDC.<br>No account. No key.</div>`) },
    { b:3, ...T('type', `<div class="t sm anim-rise">Traders get <span class="amber">alerts.</span></div>`) },
    { b:4, ...T('screen', checkerScreen()) },
    { b:3, ...T('type', `<div class="t sm anim-rise">Business licenses the <span class="amber">proof.</span></div>`) },

    // ACT 5 — verify it yourself
    { b:2, ...T('type', `<div class="t anim-pop">Verify it yourself.</div>`) },
    { b:2, ...T('type', `<div class="t sm amber anim-pop">Offline.</div>`) },
    { b:4, ...T('screen', arcscanScreen()) },
    { b:3, ...T('type', `<div class="t sm anim-pop">You never take<br>our word for it.</div>`) },

    // ACT 6 — multichain + close
    { b:2, ...T('type', `<div class="t sm anim-rise">Settling on</div>`) },
    { b:5, ...T('type', chainsBand()) },
    { b:3, ...T('type', `<div class="t sm anim-pop">The smart money,<br><span class="amber">signed before the outcome.</span></div>`) },
    { b:2, ...T('type', `<div class="t anim-pop">And all of it —</div>`) },
    { b:7, ...T('type', logoClose()) },
  ];

  function feedScreen(){return `<div class="screen"><div class="win feed">
    <div class="bar"><i class="r"></i><i class="y"></i><i class="g"></i><span class="ad"><b>predge.io</b> · live whale activity</span></div>
    <div class="big" data-count="15753076">15,700,000</div><div class="lbl">whale trades indexed · signed &amp; verifiable</div>
    <div class="row"><span class="mk">Bitcoin above $58,000 on Aug 31?</span><span class="s y">YES</span><span class="a">$31,215</span></div>
    <div class="row"><span class="mk">Strait of Hormuz normal transit?</span><span class="s n">NO</span><span class="a">$39,033</span></div>
    <div class="row"><span class="mk">Padres vs. Diamondbacks</span><span class="s n">NO</span><span class="a">$65,759</span></div>
  </div></div>`;}

  function checkerScreen(){return `<div class="screen"><div class="verdict">
    <div class="a">0x7d83c905…bd7be92</div>
    <div class="pill">✓ Verified smart money</div>
    <div class="grid">
      <div class="c"><div class="l">Win rate · resolved</div><div class="v g">97.5% <small>(≥87.1%)</small></div></div>
      <div class="c"><div class="l">Edge over price</div><div class="v g">+46.4pp</div></div>
      <div class="c"><div class="l">Leaderboard rank</div><div class="v">#4 <small>/ 8669</small></div></div>
      <div class="c"><div class="l">Resolved trades</div><div class="v">40</div></div>
    </div>
    <div class="sg"><span class="ok">✓ signed</span> · ed25519 · verifiable offline</div>
  </div></div>`;}

  function arcscanScreen(){return `<div class="screen"><div class="win">
    <div class="bar"><i class="r"></i><i class="y"></i><i class="g"></i><span class="ad">🔒 <b>testnet.arcscan.app</b>/tx/0x42b4692b…</span></div>
    <div class="body"><pre><span class="cd">Transaction</span>  <span class="cg">● Success</span>
  <span class="cd">Method</span>  <span class="ca">payForRoute</span>
  <span class="cd">Value</span>   <span class="ca">0.005 USDC</span> <span class="cd">(native)</span>
  <span class="cd">▸ Event</span> <span class="ca">Paid</span>(payer, routeHash, amount, requestId)
       requestId <span class="cd">ec6fa57d…</span>  <span class="cg">← the access credential</span><span class="caret"></span></pre></div>
  </div></div>`;}

  function termScreen(){return `<div class="screen"><div class="win">
    <div class="bar"><i class="r"></i><i class="y"></i><i class="g"></i><span class="ad">agent.mjs — <b>x402 → pay → signed data</b></span></div>
    <div class="body"><pre><span class="cd">GET /v1/whales/latest</span>            <span class="cr">402 Payment Required</span>
  pay <span class="ca">0.005 USDC</span> → retry with receipt
<span class="cg">200 OK</span>  BUY_YES $48,212  "Fed cut in Sep 2026?" <span class="cd">score 87</span>
       <span class="cg">✓ ed25519 signed</span> · verify offline · no API key<span class="caret"></span></pre></div>
  </div></div>`;}

  function kalshiScreen(){return `<div class="screen"><div class="win feed">
    <div class="bar"><i class="r"></i><i class="y"></i><i class="g"></i><span class="ad"><b>predge.io</b> · Kalshi institutional flow</span></div>
    <div class="big">$2.41M</div><div class="lbl">large institutional prints today · signed</div>
    <div class="row"><span class="mk">Fed decision — March FOMC</span><span class="s y">YES</span><span class="a">$412,000</span></div>
    <div class="row"><span class="mk">CPI above 3.2% in April?</span><span class="s n">NO</span><span class="a">$188,500</span></div>
    <div class="row"><span class="mk">Government shutdown before Q2?</span><span class="s n">NO</span><span class="a">$96,200</span></div>
  </div></div>`;}

  function sportsScreen(){return `<div class="screen"><div class="win feed">
    <div class="bar"><i class="r"></i><i class="y"></i><i class="g"></i><span class="ad"><b>predge.io</b> · signed sports outcomes</span></div>
    <div class="big">1,284</div><div class="lbl">resolved games attested today · ed25519</div>
    <div class="row"><span class="mk">Lakers vs. Celtics — final</span><span class="s y">LAL 112–108</span><span class="a">✓ signed</span></div>

  // ── ENGINE ────────────────────────────────────────────────────
  const frame = document.getElementById('frame');
  document.getElementById('bpmv').textContent = BPM;
  const layers = FRAMES.map(f=>{
    const el=document.createElement('div');
    el.className='layer '+f.cls;
    el.innerHTML=f.html;
    frame.appendChild(el);
    return el;
  });
  // cumulative start time (seconds) of each frame
  const starts=[]; let acc=0;
  FRAMES.forEach(f=>{starts.push(acc); acc+=f.b*BEAT;});
  const TOTAL=acc;

  let raf=null, t0=0, cur=-1, running=false;
  const clock=document.getElementById('clock');

  // Count a number up to its data-count target over ~1s when its frame opens.
  function runCountUp(el){
    const node=el.querySelector('[data-count]'); if(!node) return;
    const target=parseInt(node.getAttribute('data-count'),10);
    const start=Math.round(target*0.985); const dur=1000; const t0=performance.now();
    const fmt=n=>n.toLocaleString('en-US');
    (function step(now){
      const p=Math.min(1,(now-t0)/dur);
      const eased=1-Math.pow(1-p,3);
      node.textContent=fmt(Math.round(start+(target-start)*eased));
      if(p<1 && cur>=0 && layers[cur]===el) requestAnimationFrame(step);
    })(t0);
  }
  function showFrame(i){
    if(i===cur) return;
    if(cur>=0) layers[cur].classList.remove('on');
    cur=i;
    if(i>=0 && i<layers.length){
      // re-trigger entrance animations
      const el=layers[i];
      el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
      runCountUp(el);
      // flash-cut: a white beat only on screen cuts (keeps it from strobing)
      if(FRAMES[i] && FRAMES[i].cls==='screen'){
        flashEl.classList.remove('hit'); void flashEl.offsetWidth; flashEl.classList.add('hit');
      }
    }
  }
  const flashEl=document.getElementById('flash');
  function tick(now){
    const t=(now-t0)/1000;
    let i=starts.length-1;
    for(let k=0;k<starts.length;k++){ if(t<starts[k]){ i=k-1; break; } }
    if(i<0) i=0;
    showFrame(Math.min(i,layers.length-1));
    clock.textContent=t.toFixed(1)+'s · frame '+(cur+1)+'/'+layers.length;
    if(t<TOTAL){ raf=requestAnimationFrame(tick); }
    else{ running=false; }
  }
  function play(){
    cancelAnimationFrame(raf); cur=-1; layers.forEach(l=>l.classList.remove('on'));
    running=true; t0=performance.now(); raf=requestAnimationFrame(tick);
  }
  // 3·2·1·GO count-in synced to the beat, then play
  const count=document.getElementById('count'), countn=document.getElementById('countn');
  function startWithCountIn(){
    if(running) return;
    let n=3; count.classList.add('on'); countn.classList.remove('go'); countn.textContent=n;
    const iv=setInterval(()=>{
      n--;
      if(n>0){ countn.textContent=n; }
      else if(n===0){ countn.textContent='●'; countn.classList.add('go'); }
      else{ clearInterval(iv); count.classList.remove('on'); play(); }
    }, BEAT*1000);
  }

  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(e.key===' '){ e.preventDefault(); startWithCountIn(); }
    else if(k==='r'){ e.preventDefault(); play(); }               // instant restart, no count-in
    else if(k==='f'){ e.preventDefault(); (document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()); }
    else if(k==='h'){ e.preventDefault(); document.body.classList.toggle('recording'); }
  });

  // show the opening frame at rest so the stage isn't black before start
  showFrame(0);
</script>
